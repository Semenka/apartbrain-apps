name: Publish transcriber image

on:
  push:
    branches: [main]
    paths:
      - "microphone-transcriber/**"
      - ".github/workflows/publish-transcriber.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: microphone-transcriber
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/semenka/apartbrain-transcriber:0.1.1
            ghcr.io/semenka/apartbrain-transcriber:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
