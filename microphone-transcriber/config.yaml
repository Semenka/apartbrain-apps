name: "Apartbrain Conversation Transcriber"
version: "0.2.3"
slug: "apartbrain_transcriber"
description: "Privacy-first USB microphone recording, local transcription, and weekly digests"
url: "https://github.com/Semenka/apartbrain-apps/tree/main/microphone-transcriber"
arch:
  - aarch64
  - amd64
image: "ghcr.io/semenka/apartbrain-transcriber"
startup: application
boot: auto
init: false
audio: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:microphone-message
map:
  - type: share
    read_only: false
    path: /share
options:
  recording_enabled: false
  language: "auto"
  model: "small"
  segment_minutes: 30
  retention_days: 30
  digest_weekday: 0
  digest_hour: 9
  timezone: "Europe/Rome"
  notify_services:
    - "mobile_app_YOUR_PHONE"
  microphone_source: "default"
  speaker_gate_enabled: true
  allowed_speakers:
    - "Vika"
    - "Ale"
    - "Andrey"
  speaker_match_threshold: 0.62
  speaker_confirmations: 2
  speaker_confirmation_window_seconds: 30
  conversation_hold_minutes: 5
  conversation_reply_window_seconds: 30
  vika_display_name: "Victoria"
  unidentified_speaker_label: "Victoria"
  transcription_prompt: "Apartment family conversation in Russian, Italian, or English. Speaker names: Victoria, Ale, and Andrey. Preserve the spoken language."
schema:
  recording_enabled: bool
  language: "str"
  model: "list(tiny|base|small|medium)"
  segment_minutes: "int(1,60)"
  retention_days: "int(1,365)"
  digest_weekday: "int(0,6)"
  digest_hour: "int(0,23)"
  timezone: "str"
  notify_services:
    - "str"
  microphone_source: "str"
  speaker_gate_enabled: bool
  allowed_speakers:
    - "str"
  speaker_match_threshold: "float(0.4,0.9)"
  speaker_confirmations: "int(1,5)"
  speaker_confirmation_window_seconds: "int(5,120)"
  conversation_hold_minutes: "int(1,60)"
  conversation_reply_window_seconds: "int(5,120)"
  vika_display_name: "str"
  unidentified_speaker_label: "str"
  transcription_prompt: "str"
